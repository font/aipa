name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with black
      run: |
        black --check --diff src tests

    - name: Sort imports with isort
      run: |
        isort --check-only --diff src tests

    - name: Run unit tests
      run: |
        pytest tests/test_index_optimization.py -v -m "not slow"

    - name: Run integration tests
      run: |
        pytest tests/test_api_integration.py -v

    - name: Run all tests with coverage
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-existing-manifests:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Test with existing test manifests
      run: |
        python -c "
        import sys
        sys.path.insert(0, 'src')
        from src.rag.engine import RagEngine, K8sPolicyEnforcer
        from unittest.mock import patch, MagicMock
        
        # Mock external dependencies
        with patch('src.rag.engine.policy_loader') as mock_loader:
            mock_loader.load_policies.return_value = [
                {'content': 'Test policy', 'source': 'test.txt'}
            ]
            
            with patch('src.rag.engine.HuggingFaceEmbedding'):
                with patch('src.core.llm_factory.llm_factory.setup_global_llm'):
                    with patch('src.rag.engine.Settings'):
                        with patch('src.rag.engine.VectorStoreIndex') as mock_index_class:
                            mock_index = MagicMock()
                            mock_query_engine = MagicMock()
                            mock_index.as_query_engine.return_value = mock_query_engine
                            mock_query_engine.query.return_value = 'No violations found.'
                            mock_index_class.from_documents.return_value = mock_index
                            
                            # Test the optimization
                            engine = RagEngine()
                            engine.build_index()
                            enforcer = K8sPolicyEnforcer(engine)
                            
                            # Read and test existing manifests
                            import os
                            for manifest_file in ['tests/deployment-compliant.yaml', 'tests/deployment-with-violations.yaml']:
                                if os.path.exists(manifest_file):
                                    with open(manifest_file, 'r') as f:
                                        manifest = f.read()
                                    violations = enforcer.enforce_policy(manifest)
                                    print(f'Tested {manifest_file}: {len(violations)} violations')
                                    
        print('✅ All existing manifest tests passed!')
        " 